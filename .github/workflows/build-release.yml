name: Build Foundry release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build module ZIP
        run: |
          mkdir -p build/edited-campaign-tools
          rsync -a --exclude '.git' --exclude '.github' --exclude 'build' ./ build/edited-campaign-tools/
          cd build
          zip -r "Edited_Campaign_Tools_Module_v1.1.1.zip" edited-campaign-tools

      - name: Attach ZIP to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v1.1.1" "build/Edited_Campaign_Tools_Module_v1.1.1.zip" --clobber
